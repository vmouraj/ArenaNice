<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111d"><title>Arena da Nice — Bar da Menina</title><style>:root{--bg:#06111d;--card:#111922;--card2:#171d24;--gold:#efbd64;--text:#f6f3ed;--muted:#9ca4ad;--line:#28313a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70px 20px,#122238 0,#06111d 34%,#030a11 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.app{max-width:520px;margin:auto;padding:22px 18px 110px}.brand{text-align:center;margin:14px 0 22px}.brand h1{margin:0;font-size:38px;line-height:.95;letter-spacing:-1.5px;text-transform:uppercase}.brand h1 span{font-family:Georgia,serif;font-style:italic;text-transform:none;color:var(--gold);font-weight:500}.brand small{display:block;margin-top:12px;letter-spacing:5px}.date{color:var(--muted);font-size:13px;margin-bottom:15px}.new{width:100%;border:0;border-radius:18px;padding:18px;background:linear-gradient(135deg,#e7b85e,#f5d48d);font-weight:800;font-size:19px;color:#16110a;box-shadow:0 12px 30px #0005}.section{margin-top:28px}.section h2{font-size:17px}.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.cat{background:linear-gradient(145deg,#171e26,#10161d);border:1px solid var(--line);border-radius:16px;padding:13px 3px;text-align:center;font-size:10px}.cat b{font-size:27px;display:block;margin-bottom:8px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.stat{background:#111922;border:1px solid var(--line);padding:14px;border-radius:16px}.stat strong{display:block;color:var(--gold);font-size:21px}.stat span{font-size:11px;color:var(--muted)}.sale{display:flex;align-items:center;gap:12px;background:#111922;border:1px solid var(--line);padding:15px 14px;border-radius:15px;margin:8px 0}.avatar{width:39px;height:39px;border-radius:50%;background:var(--gold);color:#1a1409;display:grid;place-items:center;font-weight:800}.sale .info{flex:1}.sale .info small{display:block;color:var(--muted);margin-top:3px}.price{color:var(--gold);font-weight:700}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#0d141cfa;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:12px 10px calc(12px + env(safe-area-inset-bottom));text-align:center;font-size:11px}.bottom b{display:block;font-size:20px;margin-bottom:3px}.bottom .active{color:var(--gold)}dialog{width:min(480px,calc(100% - 24px));border:1px solid var(--line);border-radius:22px;background:#0e1720;color:white;padding:20px}dialog::backdrop{background:#000b}input{width:100%;background:#080e14;color:white;border:1px solid #34404b;border-radius:12px;padding:14px;font-size:17px}.products{max-height:46vh;overflow:auto;margin:15px 0}.prod{display:flex;align-items:center;padding:11px 2px;border-bottom:1px solid #25303a}.prod span{flex:1}.step{display:flex;align-items:center;gap:12px}.step button{width:34px;height:34px;border:0;border-radius:50%;background:var(--gold);font-size:20px}.total{font-size:22px;font-weight:800;margin:15px 0}.actions{display:flex;gap:8px}.actions button{flex:1;padding:13px;border:0;border-radius:12px;font-weight:700}.primary{background:var(--gold)}.secondary{background:#26313b;color:white}</style></head><body><main class="app"><div class="brand"><h1>Arena da <span>Nice</span></h1><small>BAR DA MENINA</small></div><div class="date" id="date"></div><button class="new" onclick="openAccount()">＋ NOVA CONTA</button><section class="section"><h2>CARDÁPIO</h2><div class="cats"><div class="cat"><b>🍺</b>CERVEJAS</div><div class="cat"><b>🥤</b>BEBIDAS</div><div class="cat"><b>🍸</b>DRINKS</div><div class="cat"><b>🍽️</b>COMIDAS</div><div class="cat"><b>🎵</b>COUVERT</div></div></section><section class="section"><h2>VENDAS DE HOJE</h2><div class="summary"><div class="stat"><strong id="count">0</strong><span>CONTAS</span></div><div class="stat"><strong id="revenue">R$ 0,00</strong><span>FATURAMENTO</span></div></div><div id="sales"></div></section></main><nav class="bottom"><div class="active"><b>⌂</b>Início</div><div><b>▤</b>Vendas</div><div><b>▥</b>Relatórios</div><div><b>⚙</b>Config.</div></nav><dialog id="dlg"><h2>Nova conta</h2><input id="customer" placeholder="Nome do cliente"><div class="products" id="products"></div><div class="total" id="total">Total: R$ 0,00</div><div class="actions"><button class="secondary" onclick="dlg.close()">Cancelar</button><button class="primary" onclick="finish()">Finalizar</button></div></dialog><script>const catalog=[['Heineken 600ml',15],['Original 600ml',14],['Brahma 600ml',12],['Corona Long Neck',12],['Stella Long Neck',11],['Coca-Cola',7],['Água',5],['Suco',8],['Para Tudo',18],['Campari',18],['Martini',18],['Pinga',8],['Isca de tilápia',42],['Panceta',38],['Frango a passarinho',38],['Espetinho',12],['Espeto no pão',16],['Porção de filé',45],['Cupim',45],['Carne de sol',45],['Hot dog gourmet',20],['Caldo pequeno',12],['Caldo grande',18],['Couvert músico',15]];let qty={};let sales=JSON.parse(localStorage.getItem('arena-sales')||'[]');const money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});date.textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});function openAccount(){qty={};customer.value='';renderProducts();dlg.showModal()}function renderProducts(){products.innerHTML=catalog.map(([n,p],i)=>`<div class="prod"><span>${n}<small style="display:block;color:#8d98a3">${money(p)}</small></span><div class="step"><button onclick="change(${i},-1)">−</button><strong>${qty[i]||0}</strong><button onclick="change(${i},1)">+</button></div></div>`).join('');calc()}function change(i,d){qty[i]=Math.max(0,(qty[i]||0)+d);renderProducts()}function calc(){let t=0;catalog.forEach((x,i)=>t+=(qty[i]||0)*x[1]);total.textContent='Total: '+money(t);return t}function finish(){if(!customer.value.trim())return alert('Informe o nome do cliente.');const t=calc();if(!t)return alert('Adicione ao menos um produto.');sales.unshift({name:customer.value.trim(),total:t,items:catalog.map((x,i)=>({name:x[0],qty:qty[i]||0,price:x[1]})).filter(x=>x.qty)});localStorage.setItem('arena-sales',JSON.stringify(sales));dlg.close();renderSales()}function renderSales(){count.textContent=sales.length;revenue.textContent=money(sales.reduce((a,b)=>a+b.total,0));salesEl=document.getElementById('sales');salesEl.innerHTML=sales.length?sales.map((s,i)=>`<div class="sale" onclick="details(${i})"><div class="avatar">${s.name[0].toUpperCase()}</div><div class="info">${s.name}<small>${s.items.reduce((a,b)=>a+b.qty,0)} itens</small></div><div class="price">${money(s.total)}</div></div>`).join(''):'<div style="color:#8d98a3;text-align:center;padding:30px">Nenhuma venda lançada hoje.</div>'}function details(i){const s=sales[i];alert(s.name+'\n\n'+s.items.map(x=>x.qty+'x '+x.name+' — '+money(x.qty*x.price)).join('\n')+'\n\nTOTAL: '+money(s.total))}renderSales()</script></body></html>
