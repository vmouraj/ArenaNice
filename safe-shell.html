<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Arena Nice"><link rel="manifest" href="/manifest.webmanifest?v=7"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=7"><title>Arena Nice</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f8fc}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="/arena-v4.html?v=7" title="Arena Nice"></iframe><script>(function(){try{const stamp=new Date().toISOString();const s=localStorage.getItem('arena-sales');const c=localStorage.getItem('arena-catalog');if(s&&!localStorage.getItem('arena-sales-safety-backup'))localStorage.setItem('arena-sales-safety-backup',s);if(c&&!localStorage.getItem('arena-catalog-safety-backup'))localStorage.setItem('arena-catalog-safety-backup',c);localStorage.setItem('arena-safety-backup-at',stamp)}catch(e){}const f=document.getElementById('app');f.addEventListener('load',()=>{try{const d=f.contentDocument;const sc=d.createElement('script');sc.textContent=`(function(){
try{
  catalog=(catalog||[]).map(p=>({...p,id:p.id||crypto.randomUUID()}));
  sales=(sales||[]).map(s=>({...s,id:s.id||s._supabase_id||crypto.randomUUID()}));
  localStorage.setItem('arena-catalog',JSON.stringify(catalog));
  localStorage.setItem('arena-sales',JSON.stringify(sales));
}catch(e){}
function persistLocal(){
  localStorage.setItem('arena-sales',JSON.stringify(sales));
  localStorage.setItem('arena-catalog',JSON.stringify(catalog));
  renderAll();
  try{document.getElementById('syncStatus').textContent='Dados salvos neste aparelho';}catch(e){}
}
saveSale=async function(s){
  const i=sales.findIndex(x=>x.id===s.id);
  if(i>=0)sales[i]=s;else sales.push(s);
  persistLocal();
  return true;
};
saveOpen=async function(){try{let status=edit?.status||'open',s=buildSale(status);if(status==='closed'&&!selectedPay)throw Error('Escolha a forma de pagamento.');await saveSale(s);account.close()}catch(e){alert(e.message)}};
closeAccount=async function(){try{if(!selectedPay)throw Error('Escolha a forma de pagamento.');let s=buildSale('closed');if(!s.items.length)throw Error('Adicione ao menos um produto.');await saveSale(s);account.close()}catch(e){alert(e.message)}};
editProduct=async function(id,f,v){let p=catalog.find(x=>String(x.id)===String(id));if(!p)return;if(f==='price')p.price=Number(String(v).replace(',','.'));else p.name=v.trim();persistLocal();renderMenu()};
deleteProduct=async function(id){catalog=catalog.filter(x=>String(x.id)!==String(id));persistLocal();renderMenu()};
addProduct=async function(){let n=document.getElementById('newName').value.trim(),p=Number(document.getElementById('newPrice').value.replace(',','.'));if(!n||!Number.isFinite(p))return alert('Confira nome e preço.');catalog.push({id:crypto.randomUUID(),name:n,price:p,cat:cat||'outros'});document.getElementById('newName').value='';document.getElementById('newPrice').value='';persistLocal();renderMenu()};
setStatus=function(){try{document.getElementById('syncStatus').textContent='Dados salvos neste aparelho';}catch(e){}};
setStatus();renderAll();
})();`;d.body.appendChild(sc)}catch(e){console.error(e)}})})();</script></body></html>
