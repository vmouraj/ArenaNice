<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Arena Nice"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-512.png"><title>Arena Nice — Bar da Menina</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f9fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#fff;z-index:5}.card{text-align:center;padding:28px}.brand{font-weight:900;font-size:32px;color:#0D2F67;text-transform:uppercase}.brand i{font-family:Georgia,serif;text-transform:none;color:#FFB000}.sub{margin-top:8px;font-size:10px;letter-spacing:4px;color:#10234A;font-weight:800}.msg{margin-top:22px;color:#72809A;font-size:13px}.dot{width:34px;height:34px;margin:18px auto;border:4px solid #E6ECF5;border-top-color:#1556C0;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}iframe{display:none;border:0;width:100%;height:100%}</style></head><body><div id="loading" class="loading"><div class="card"><div class="brand">Arena <i>Nice</i></div><div class="sub">BAR DA MENINA</div><div class="dot"></div><div id="msg" class="msg">Sincronizando dados…</div></div></div><iframe id="app" title="Arena Nice"></iframe><script src="/supabase-sync.js"></script><script>(async()=>{const f=document.getElementById('app'),m=document.getElementById('msg');try{await ArenaSupabase.initialSync();m.textContent='Tudo certo.'}catch(e){console.error(e);m.textContent='Sem conexão. Abrindo com os dados salvos no aparelho.'}f.src='/arena-v3.html';f.onload=()=>{f.style.display='block';document.getElementById('loading').style.display='none';setInterval(()=>ArenaSupabase.backgroundSync(f),5000)};if('serviceWorker'in navigator){navigator.serviceWorker.register('/sw.js').then(r=>r.update()).catch(()=>{})}})();</script></body></html>
